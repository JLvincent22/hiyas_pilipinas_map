s": "The Ruins, Don Mariano L. Lacson Highway, Talisay City, Negros Occidental, Philippines", "lat": 10.7103, "lng": 122.9812, "did": "Did you know that this beautiful mansion became famous after it was deliberately burned during World War II to prevent Japanese forces from using it? Its concrete skeleton survived and became the landmark known as The Ruins.", "description": "The remains of the ancestral mansion of Don Mariano Ledesma Lacson. Its Italianate style reflects the wealth generated by the sugar industry and the history of prominent sugar-producing families in Negros.", "hours": "9:00 AM–8:00 PM daily, except during scheduled private-event closures.", "fee": "₱100 adults; ₱80 seniors; discounted rates for students and children (as listed in the PDF).", "food": "Piaya", "visits": ["Mansion Ruins", "Grand Columns and Arches", "Gardens"]}, {"id": "r9", "region": "Region IX · Zamboanga Peninsula", "short": "REGION IX", "place": "Fort Pilar", "city": "Zamboanga City", "address": "Fort Pilar, Valderosa Street, Zamboanga City, Philippines", "lat": 6.9056, "lng": 122.0782, "did": "Did you know that Fort Pilar has been standing in Zamboanga for almost 400 years? Its walls once served as a military stronghold and now preserve stories, artifacts, and religious heritage.", "description": "A 17th-century Spanish fort that served as a military stronghold and is now an important historical and cultural landmark. It also houses museum collections connected to Zamboanga and the surrounding region.", "hours": "9:00 AM–5:00 PM daily.", "fee": "Free.", "food": "Curacha", "visits": ["Fort Pilar Shrine", "National Museum of the Philippines–Zamboanga", "Historic Fortress Walls"]}, {"id": "r10", "region": "Region X · Northern Mindanao", "short": "REGION X", "place": "Butuan Archaeological Sites", "city": "Butuan City, Agusan del Norte", "address": "Butuan Archaeological Sites, Ambangan, Barangay Libertad, Butuan City, Agusan del Norte, Philippines", "lat": 8.9475, "lng": 125.5436, const $ = id => document.getElementById(id);
let selected = REGIONS[0];
// To use your own Google Maps Share > Embed a map URL for a region,
 // add mapEmbed: 'https://www.google.com/maps/embed?pb=...' to that region's object.
 // The automatic address-based Google Maps embed remains the fallback.
function mapUrl(r){return (r.mapEmbed && r.mapEmbed.trim()) ? r.mapEmbed : 'https://maps.google.com/maps?q='+encodeURIComponent(r.address)+'&z=14&output=embed'}
function renderList(filter=''){
 const list=$('regionList');list.innerHTML='';
 const filtered=REGIONS.filter(r=>(r.region+' '+r.short+' '+r.place+' '+r.city).toLowerCase().includes(filter.toLowerCase()));
 filtered.forEach((r)=>{const b=document.createElement('button');b.className='region'+(r.id===selected.id?' active':'');b.innerHTML='<span class="num">'+String(REGIONS.indexOf(r)+1).padStart(2,'0')+'</span><span class="rname">'+r.region+' · '+r.place+'</span>';b.addEventListener('click',()=>{selectRegion(r.id);$('sidebar').classList.remove('open');$('regionToggle').setAttribute('aria-expanded','false')});list.appendChild(b)});
 if(!filtered.length)list.innerHTML='<div style="padding:15px;color:#d8c18b;font:12px Arial">No matching region found.</div>';
}
function selectRegion(id){
 selected=REGIONS.find(r=>r.id===id)||REGIONS[0];
 $('map').src=mapUrl(selected);$('mapRegion').textContent=selected.short+' · '+selected.region.toUpperCase();
 $('regionKicker').textContent=selected.short+' · '+selected.region.toUpperCase();
 $('selectedRegionLabel').textContent=selected.short+' · '+selected.place;
 $('placeName').textContent=selected.place;$('placeMeta').textContent=selected.city+', Philippines';
 $('description').textContent=selected.description;
 $('directions').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(selected.address);
 renderList($('search').value);
}
$('search').addEventListener('input',e=>{renderList(e.target.value);$('sidebar').classList.add('open')});
$('regionToggle').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('regionToggle').setAttribute('aria-expanded',String(open))});
document.addEventListener('click',e=>{if(!$('sidebar').contains(e.target)&&!$('search').contains(e.target)){$('sidebar').classList.remove('open');$('regionToggle').setAttribute('aria-expanded','false')}});
selectRegion('ncr');
</script>
